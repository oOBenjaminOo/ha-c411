# Exemple issu du tableau de bord C411.
# Dépendances frontend : Mushroom et Button Card (HACS).
# Utilise les entités et attributs de la intégration C411.
# Les identifiants peuvent être adaptés dans l’éditeur de carte.
type: vertical-stack
cards:
  - type: custom:button-card
    show_name: false
    show_state: false
    show_entity_picture: true
    entity_picture: https://c411.org/images/logo-md.png
    tap_action:
      action: url
      url_path: https://c411.org/
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 12px 0 8px
      img_cell:
        - height: 56px
      entity_picture:
        - width: 140px
        - max-height: 56px
        - object-fit: contain
  - type: custom:button-card
    entity: sensor.c411_utilisateur
    show_entity_picture: true
    icon: mdi:account-circle
    entity_picture: >-
      [[[ return entity?.attributes?.entity_picture || ''; ]]]
    show_name: true
    show_label: true
    triggers_update:
      - sensor.c411_zen
      - sensor.c411_niveau
      - sensor.c411_rang
      - sensor.c411_marge_de_telechargement
      - sensor.c411_ratio
      - sensor.c411_envoye
      - sensor.c411_telecharge
      - binary_sensor.c411_freeleech
      - binary_sensor.c411_silverleech
      - binary_sensor.c411_telechargement_autorise
    name: >-
      [[[ return entity && !['unknown','unavailable'].includes(entity.state) ?
      entity.state : 'Profil indisponible'; ]]]
    label: >-
      [[[ return 'Niveau ' + (states['sensor.c411_niveau']?.state ?? '?') + ' -
      ' + (states['sensor.c411_rang']?.state ?? 'Indisponible'); ]]]
    tap_action:
      action: none
    extra_styles: |
      #details_panel { display: none; }
      ha-card:has(details.c411-disclosure[open]) #details_panel { display: block; }
      .c411-disclosure summary {
        list-style: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--divider-color);
        border-radius: 12px;
        padding: 3px 7px;
        font-size: 11px;
        font-weight: 600;
      }
      .c411-disclosure summary::-webkit-details-marker { display: none; }
      .c411-disclosure[open] ha-icon { transform: rotate(180deg); }
    styles:
      card:
        - padding: 10px 12px
      grid:
        - grid-template-areas: >-
            "i n zen ." "i l l l" "xp xp xp xp" "stats stats stats stats" "alertes alertes alertes alertes" "details_panel details_panel details_panel details_panel"
        - grid-template-columns: 40px auto auto 1fr
        - grid-template-rows: min-content min-content auto auto auto auto
        - column-gap: 12px
        - row-gap: 3px
      img_cell:
        - width: 40px
        - height: 40px
      entity_picture:
        - width: 40px
        - height: 40px
        - border-radius: 50%
        - object-fit: cover
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 600
      label:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
      custom_fields:
        zen:
          - justify-self: start
          - font-size: 14px
          - font-weight: 600
        xp:
          - width: 100%
          - text-align: left
        stats:
          - container-type: inline-size
          - width: 100%
          - min-width: 0
        alertes:
          - width: 100%
          - text-align: left
        details_panel:
          - width: 100%
          - min-width: 0
          - padding-top: 4px
    custom_fields:
      zen: >-
        [[[ const z = states['sensor.c411_zen']?.state; const n = z &&
        !['unknown', 'unavailable'].includes(z) ?
        Number(z).toLocaleString('fr-FR') : '?'; return '<span
        style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap"><span
        style="margin-right:3px">-</span>' + n + '<img
        src="https://c411.org/images/tokenization/zen.svg" alt="Zen"
        style="width:22px;height:22px;object-fit:contain"></span>'; ]]]
      xp: >-
        [[[ const l = entity?.attributes?.level; if (!l) return ''; const into =
        Number(l.xpIntoLevel) || 0; const remaining = Math.max(0,
        Number(l.xpToNextLevel) || 0); const total = into + remaining; const p =
        total ? Math.max(0, Math.min(100, into / total * 100)) : 0; const next =
        Number(l.level) + 1; return '<div style="margin-top:5px"><div
        role="progressbar" aria-label="Progression du niveau" aria-valuenow="' +
        Math.round(p) + '" aria-valuemin="0" aria-valuemax="100"
        style="height:4px;background:var(--divider-color);border-radius:4px;overflow:hidden"><div
        style="height:100%;width:' + p +
        '%;background:#34d399;border-radius:4px"></div></div><div
        style="display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:11px;color:var(--secondary-text-color)"><span>'
        + Math.round(p) + ' % - ' + into.toLocaleString('fr-FR') + ' / ' +
        total.toLocaleString('fr-FR') + ' XP</span><span>' +
        remaining.toLocaleString('fr-FR') + ' XP avant le niveau ' + next +
        '</span></div></div>'; ]]]
      stats:
        card:
          type: grid
          columns: 4
          square: false
          cards:
            - type: custom:button-card
              entity: sensor.c411_marge_de_telechargement
              layout: icon_name
              show_entity_picture: true
              entity_picture: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22dl-fill-v-0-0-2%22%3E%3Cpath%20d%3D%22M9.25%203.5h5.5a1%201%200%200%201%201%201v6.75h3.1a.75.75%200%200%201%20.53%201.28l-6.85%206.85a.75.75%200%200%201-1.06%200l-6.85-6.85a.75.75%200%200%201%20.53-1.28h3.1V4.5a1%201%200%200%201%201-1Z%22%3E%3C%2Fpath%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M9.25%203.5h5.5a1%201%200%200%201%201%201v6.75h3.1a.75.75%200%200%201%20.53%201.28l-6.85%206.85a.75.75%200%200%201-1.06%200l-6.85-6.85a.75.75%200%200%201%20.53-1.28h3.1V4.5a1%201%200%200%201%201-1Z%22%20fill%3D%22%2334d399%22%20fill-opacity%3D%220.12%22%3E%3C%2Fpath%3E%3Crect%20x%3D%220%22%20y%3D%225.392423135587444%22%20width%3D%2224%22%20height%3D%2218.607576864412557%22%20fill%3D%22%2334d399%22%20fill-opacity%3D%220.85%22%20clip-path%3D%22url(%23dl-fill-v-0-0-2)%22%3E%3C%2Frect%3E%3Cpath%20d%3D%22M9.25%203.5h5.5a1%201%200%200%201%201%201v6.75h3.1a.75.75%200%200%201%20.53%201.28l-6.85%206.85a.75.75%200%200%201-1.06%200l-6.85-6.85a.75.75%200%200%201%20.53-1.28h3.1V4.5a1%201%200%200%201%201-1Z%22%20fill%3D%22none%22%20stroke%3D%22%2334d399%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%3E%3C%2Fpath%3E%3C%2Fsvg%3E
              tooltip: Marge de téléchargement
              name: >-
                [[[[ const value = entity?.attributes?.bytes;
                if (!Number.isFinite(value) || ['unknown', 'unavailable'].includes(entity?.state)) return '—';
                const large = Math.abs(value) >= 1099511627776; return (value / (large ? 1099511627776 : 1073741824)).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + (large ? ' To' : ' Go'); ]]]]
              tap_action:
                action: more-info
              styles:
                card:
                  - padding: 5px 1px
                  - border: 0
                  - background: none
                  - box-shadow: none
                grid:
                  - grid-template-columns: 16px auto
                  - column-gap: 3px
                  - justify-content: center
                icon:
                  - color: '#34d399'
                  - width: 15px
                entity_picture:
                  - width: 16px
                name:
                  - font-size: 11px
                  - font-weight: 600
                  - white-space: nowrap
            - type: custom:button-card
              entity: sensor.c411_ratio
              layout: icon_name
              icon: mdi:swap-vertical
              tooltip: Ratio
              name: >-
                [[[[ const value = Number(entity?.state);
                if (!Number.isFinite(value) || ['unknown', 'unavailable'].includes(entity?.state)) return '—';
                return value.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); ]]]]
              tap_action:
                action: more-info
              styles:
                card:
                  - padding: 5px 1px
                  - border: 0
                  - background: none
                  - box-shadow: none
                grid:
                  - grid-template-columns: 16px auto
                  - column-gap: 3px
                  - justify-content: center
                icon:
                  - color: '#34d399'
                  - width: 15px
                entity_picture:
                  - width: 16px
                name:
                  - font-size: 11px
                  - font-weight: 600
                  - white-space: nowrap
            - type: custom:button-card
              entity: sensor.c411_envoye
              layout: icon_name
              icon: mdi:upload
              tooltip: Envoyé
              name: >-
                [[[[ const value = entity?.attributes?.bytes;
                if (!Number.isFinite(value) || ['unknown', 'unavailable'].includes(entity?.state)) return '—';
                const large = Math.abs(value) >= 1099511627776; return (value / (large ? 1099511627776 : 1073741824)).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + (large ? ' To' : ' Go'); ]]]]
              tap_action:
                action: more-info
              styles:
                card:
                  - padding: 5px 1px
                  - border: 0
                  - background: none
                  - box-shadow: none
                grid:
                  - grid-template-columns: 16px auto
                  - column-gap: 3px
                  - justify-content: center
                icon:
                  - color: '#34d399'
                  - width: 15px
                entity_picture:
                  - width: 16px
                name:
                  - font-size: 11px
                  - font-weight: 600
                  - white-space: nowrap
            - type: custom:button-card
              entity: sensor.c411_telecharge
              layout: icon_name
              icon: mdi:download
              tooltip: Téléchargé
              name: >-
                [[[[ const value = entity?.attributes?.bytes;
                if (!Number.isFinite(value) || ['unknown', 'unavailable'].includes(entity?.state)) return '—';
                const large = Math.abs(value) >= 1099511627776; return (value / (large ? 1099511627776 : 1073741824)).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + (large ? ' To' : ' Go'); ]]]]
              tap_action:
                action: more-info
              styles:
                card:
                  - padding: 5px 1px
                  - border: 0
                  - background: none
                  - box-shadow: none
                grid:
                  - grid-template-columns: 16px auto
                  - column-gap: 3px
                  - justify-content: center
                icon:
                  - color: '#60a5fa'
                  - width: 15px
                entity_picture:
                  - width: 16px
                name:
                  - font-size: 11px
                  - font-weight: 600
                  - white-space: nowrap
      alertes: >-
        [[[
          const badge = (icon, label, state, color) => html`
            <span title="${label} : ${state}" style="display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:12px;color:${color};font-size:11px;font-weight:600">
              <ha-icon icon="${icon}" style="--mdc-icon-size:14px"></ha-icon>
              <span>${label} · ${state}</span>
            </span>`;
          const muted = 'var(--secondary-text-color)';
          const profile = states['sensor.c411_utilisateur'];
          const attributes = profile?.attributes || {};
          const sourceLabels = {personal: 'personnel', campaign: 'campagne', window: 'créneau'};
          const sources = Array.isArray(attributes.freeleech?.sources)
            ? [...new Set(attributes.freeleech.sources.filter(source => Object.hasOwn(sourceLabels, source)).map(source => sourceLabels[source]))] : [];
          const status = (id, icon, label, color, detail = '') => {
            const value = states[id]?.state;
            return badge(icon, label, value === 'on' ? (detail ? `actif (${detail})` : 'actif') : value === 'off' ? 'inactif' : 'indisponible',
              value === 'on' ? color : muted);
          };
          const download = states['binary_sensor.c411_telechargement_autorise']?.state;
          const badges = [
            status('binary_sensor.c411_freeleech', 'mdi:lightning-bolt', 'Freeleech', '#f87171', sources.join(', ')),
            status('binary_sensor.c411_silverleech', 'mdi:lightning-bolt', 'SilverLeech', '#22d3ee')
          ];
          if (download === 'off') {
            const reason = attributes.download?.blockedReason;
            const detail = reason === 'insufficient_balance' ? ' (solde insuffisant)' : '';
            badges.push(badge('mdi:download-off-outline', 'Téléchargement', `bloqué${detail}`, '#f87171'));
          }
          const toggle = event => {
            event.preventDefault();
            event.stopPropagation();
            const disclosure = event.currentTarget.parentElement;
            disclosure.open = !disclosure.open;
          };
          const keepKeyLocal = event => event.stopPropagation();
          return html`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px">
            ${badges}<details class="c411-disclosure"><summary @click=${toggle}
            @keydown=${keepKeyLocal}><ha-icon icon="mdi:chevron-down"
            style="--mdc-icon-size:14px"></ha-icon>Détails</summary></details></div>`;
        ]]]
      details_panel:
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Détails C411
              icon: mdi:information-outline
            - type: grid
              columns: 2
              square: false
              cards:
                - type: custom:mushroom-template-card
                  entity: sensor.c411_zen_gagnes
                  primary: Zen gagnés
                  secondary: >-
                    {{ states(entity) if has_value(entity) else 'Indisponible' }}
                  icon: mdi:plus-circle-outline
                  tap_action:
                    action: more-info
                - type: custom:mushroom-template-card
                  entity: sensor.c411_zen_depenses
                  primary: Zen dépensés
                  secondary: >-
                    {{ states(entity) if has_value(entity) else 'Indisponible' }}
                  icon: mdi:minus-circle-outline
                  tap_action:
                    action: more-info
                - type: custom:mushroom-template-card
                  entity: sensor.c411_envoye_reel
                  primary: Envoyé hors crédits
                  secondary: >-
                    {% set bytes = state_attr(entity, 'bytes') %}
                    {% set large = bytes is number and bytes >= 1099511627776 %}
                    {{ ('%.2f' | format(bytes / (1099511627776 if large else 1073741824)) | replace('.', ',')) ~ (' To' if large else ' Go') if has_value(entity) and bytes is number else 'Indisponible' }}
                  icon: mdi:upload
                  tap_action:
                    action: more-info
                - type: custom:mushroom-template-card
                  entity: sensor.c411_telecharge_reel
                  primary: Téléchargé hors crédits
                  secondary: >-
                    {% set bytes = state_attr(entity, 'bytes') %}
                    {% set large = bytes is number and bytes >= 1099511627776 %}
                    {{ ('%.2f' | format(bytes / (1099511627776 if large else 1073741824)) | replace('.', ',')) ~ (' To' if large else ' Go') if has_value(entity) and bytes is number else 'Indisponible' }}
                  icon: mdi:download
                  tap_action:
                    action: more-info
                - type: custom:mushroom-template-card
                  entity: sensor.c411_equipe
                  primary: Équipe
                  secondary: >-
                    {{ states(entity) if has_value(entity) else 'Sans équipe' if state_attr(entity, 'no_team') == true else 'Indisponible' }}
                  icon: mdi:account-group-outline
                  tap_action:
                    action: more-info
                - type: custom:mushroom-template-card
                  entity: sensor.c411_quetes_terminees
                  primary: Quêtes terminées
                  secondary: >-
                    {{ states(entity) if has_value(entity) else 'Indisponible' }}
                  icon: mdi:clipboard-check-outline
                  tap_action:
                    action: more-info
